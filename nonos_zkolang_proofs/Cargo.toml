# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the zkolang VM. Runs a real VM program, lays its trace
# out for the step AIR, and drives the money-grade Poseidon-committed STARK prover
# and verifier to prove the honest run accepts and a tampered run is rejected.

[package]
name = "nonos_zkolang_proofs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
nonos_zkolang = { path = "../nonos_zkolang" }
# The STARKs repository, pinned by commit.
nonos-stark = { git = "https://github.com/NON-OS/STARKs", rev = "a47d23ae969e23b5f841e30b49a1d483a80a6b02" }
