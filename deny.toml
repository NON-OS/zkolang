# Supply-chain policy for cargo-deny. The dependency surface is deliberately
# small, so the allowed licenses are the common permissive ones plus the
# project's own AGPL. Anything outside this list fails the security workflow.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
]
confidence-threshold = 0.9

[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
