name: lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job reads the repository and writes nothing back.
permissions:
  contents: read

# New push, old run dies: a superseded run burning minutes helps nobody.
concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true
jobs:
  proofs:
    name: machine-checked proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The pinned toolchain is a few hundred MB from releases.lean-lang.org.
      # That host has gone down and taken this gate red with it while every
      # proof in the repo was fine, so keep a copy.
      - name: cache the toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}

      # Install elan. It reads lean/lean-toolchain and pulls the pinned Lean on
      # the first lake invocation in that directory.
      # elan pulls from releases.lean-lang.org, which 404s for the pinned
      # version: the project ages old releases off that host. GitHub still
      # serves them, so fetch it there and drop it where elan looks. The
      # directory name is elan's encoding of leanprover/lean4:v4.15.0.
      - name: install the pinned toolchain
        run: |
          set -euo pipefail
          pin=$(tr -d '[:space:]' < lean/lean-toolchain)          # leanprover/lean4:v4.15.0
          ver=${pin##*:}                                          # v4.15.0
          dir="$HOME/.elan/toolchains/$(echo "$pin" | sed 's|/|--|; s|:|---|')"
          if [ ! -x "$dir/bin/lake" ]; then
            curl -sSfL --retry 5 --retry-all-errors --connect-timeout 20 \
              "https://github.com/leanprover/lean4/releases/download/$ver/lean-${ver#v}-linux.tar.zst" \
              -o lean.tar.zst
            mkdir -p "$dir"
            tar --use-compress-program=unzstd -xf lean.tar.zst -C "$dir" --strip-components=1
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/lake" --version

      - name: lake build
        working-directory: lean
        run: lake build

      # A proof that leans on sorry is not a proof. The sources must be clean,
      # so the theorem count in the README stands for real obligations.
      - name: no sorry, no admit
        run: |
          if grep -rnE '\b(sorry|admit)\b' lean --include='*.lean'; then
            echo "found an unproven placeholder in the Lean sources"
            exit 1
          fi
          echo "no sorry, no admit"

      # The trust base, checked rather than claimed. Audit.lean prints the axioms
      # each load-bearing theorem actually depends on; a clean core proof rests
      # only on propext, Classical.choice, and Quot.sound. native_decide would add
      # ofReduceBool, trusting the compiler's evaluator, and a sorry would add
      # sorryAx. Either fails the gate, so VERIFICATION.md's "no native_decide, no
      # axiom" is enforced by the build.
      - name: axiom audit
        working-directory: lean
        run: |
          set -euo pipefail
          out=$(lake env lean Zkolang/Audit.lean 2>&1)
          echo "$out"
          if echo "$out" | grep -qE 'ofReduceBool|sorryAx'; then
            echo "a theorem depends on a compiler-trust or placeholder axiom"
            exit 1
          fi
          echo "axiom base clean: no ofReduceBool, no sorryAx"
