name: lean

on:
  push:
    branches: [main]
  pull_request:

jobs:
  proofs:
    name: machine-checked proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Install elan. It reads lean/lean-toolchain and pulls the pinned Lean on
      # the first lake invocation in that directory.
      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          chmod +x elan-init.sh
          ./elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The build is the check: a theorem that did not type check fails here.
      - name: lake build
        working-directory: lean
        run: lake build

      # A proof that leans on sorry is not a proof. The sources must be clean,
      # so the theorem count in the README stands for real obligations.
      - name: no sorry, no admit
        run: |
          if grep -rnE '\b(sorry|admit)\b' lean --include='*.lean'; then
            echo "found an unproven placeholder in the Lean sources"
            exit 1
          fi
          echo "no sorry, no admit"
