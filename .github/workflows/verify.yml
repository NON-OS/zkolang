name: verify

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  kani:
    name: model checked
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The harnesses cover the deserialiser, which reads an untrusted trailer.
      # A model checker settles totality over every byte sequence in the bound
      # rather than the ones a fuzzer happened to reach, which is the property
      # that keeps the spawn gate safe.
      #
      # The action ships a prebuilt Kani. Building the verifier from source ran
      # past an hour on its own and left no budget for the checking.
      - uses: model-checking/kani-github-action@v1.1
        with:
          args: -p stark_proofs --output-format terse

  axioms:
    name: no axioms beyond the core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          chmod +x elan-init.sh
          ./elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build
        working-directory: lean
        run: lake build

      # `no sorry` is not the whole claim. A theorem can typecheck and still rest
      # on an axiom, so every public theorem states which it uses and the ones
      # that claim to be constructive are held to it.
      - name: print axioms
        working-directory: lean
        run: |
          {
            echo "import Zkolang"
            grep -rhoE '^theorem [A-Za-z0-9_.]+' Zkolang \
              | sed 's/^theorem //' \
              | while read -r t; do
                  ns=$(grep -rl "theorem $t" Zkolang | head -1 \
                       | sed 's|^Zkolang/|Zkolang.|; s|\.lean$||')
                  echo "#print axioms $ns.$t"
                done
          } > /tmp/axioms.lean
          lake env lean /tmp/axioms.lean | tee /tmp/axioms.out
          if grep -q 'sorryAx' /tmp/axioms.out; then
            echo "a theorem rests on sorryAx"
            exit 1
          fi
