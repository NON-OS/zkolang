name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job reads the repository and writes nothing back.
permissions:
  contents: read

# New push, old run dies: a superseded run burning minutes helps nobody.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always

jobs:
  axioms:
    name: no axioms beyond the core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Same reason as lean.yml: the toolchain host going down should not turn
      # this red while every proof in the repo is fine.
      - name: cache the toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}

      # elan pulls from releases.lean-lang.org, which 404s for the pinned
      # version: the project ages old releases off that host. GitHub still
      # serves them, so fetch it there and drop it where elan looks. The
      # directory name is elan's encoding of leanprover/lean4:v4.15.0.
      - name: install the pinned toolchain
        run: |
          set -euo pipefail
          pin=$(tr -d '[:space:]' < lean/lean-toolchain)          # leanprover/lean4:v4.15.0
          ver=${pin##*:}                                          # v4.15.0
          dir="$HOME/.elan/toolchains/$(echo "$pin" | sed 's|/|--|; s|:|---|')"
          if [ ! -x "$dir/bin/lake" ]; then
            curl -sSfL --retry 5 --retry-all-errors --connect-timeout 20 \
              "https://github.com/leanprover/lean4/releases/download/$ver/lean-${ver#v}-linux.tar.zst" \
              -o lean.tar.zst
            mkdir -p "$dir"
            tar --use-compress-program=unzstd -xf lean.tar.zst -C "$dir" --strip-components=1
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/lake" --version

      - name: lake build
        working-directory: lean
        run: lake build

      # `no sorry` is not the whole claim. A theorem can typecheck and still rest
      # on an axiom, so every public theorem states which it uses and the ones
      # that claim to be constructive are held to it.
      - name: print axioms
        working-directory: lean
        run: |
          {
            echo "import Zkolang"
            grep -rhoE '^theorem [A-Za-z0-9_.]+' Zkolang \
              | sed 's/^theorem //' \
              | while read -r t; do
                  ns=$(grep -rl "theorem $t" Zkolang | head -1 \
                       | sed 's|^Zkolang/|Zkolang.|; s|\.lean$||')
                  echo "#print axioms $ns.$t"
                done
          } > /tmp/axioms.lean
          lake env lean /tmp/axioms.lean | tee /tmp/axioms.out
          if grep -q 'sorryAx' /tmp/axioms.out; then
            echo "a theorem rests on sorryAx"
            exit 1
          fi
