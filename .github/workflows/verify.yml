name: verify

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  bytes:
    name: serial and parallel emit the same proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `parallel` is a compile-time cfg, so the two provers can never run in one
      # process and no single test can compare them. Each build prints a digest of
      # a proof over the same fixed witness; the two lines have to match.
      #
      # A divergence means a parallel map that is not order preserving, or a search
      # returning a different witness than the serial one. Either emits a proof
      # that still verifies against itself, so nothing else catches it.
      - name: serial
        run: |
          cargo test --release -p stark_proofs emit_proof_digest -- --ignored --nocapture \
            | grep PROOFDIGEST | tee /tmp/serial.txt

      - name: parallel
        run: |
          cargo test --release -p stark_proofs --features parallel emit_proof_digest \
            -- --ignored --nocapture | grep PROOFDIGEST | tee /tmp/parallel.txt

      - name: compare
        run: |
          cat /tmp/serial.txt /tmp/parallel.txt
          diff /tmp/serial.txt /tmp/parallel.txt || {
            echo "the two prover forms emit different proofs"
            exit 1
          }

  axioms:
    name: no axioms beyond the core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          chmod +x elan-init.sh
          ./elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build
        working-directory: lean
        run: lake build

      # `no sorry` is not the whole claim. A theorem can typecheck and still rest
      # on an axiom, so every public theorem states which it uses and the ones
      # that claim to be constructive are held to it.
      - name: print axioms
        working-directory: lean
        run: |
          {
            echo "import Zkolang"
            grep -rhoE '^theorem [A-Za-z0-9_.]+' Zkolang \
              | sed 's/^theorem //' \
              | while read -r t; do
                  ns=$(grep -rl "theorem $t" Zkolang | head -1 \
                       | sed 's|^Zkolang/|Zkolang.|; s|\.lean$||')
                  echo "#print axioms $ns.$t"
                done
          } > /tmp/axioms.lean
          lake env lean /tmp/axioms.lean | tee /tmp/axioms.out
          if grep -q 'sorryAx' /tmp/axioms.out; then
            echo "a theorem rests on sorryAx"
            exit 1
          fi
