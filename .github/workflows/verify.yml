name: verify

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# The model check runs in nightly.yml, not here. The harnesses cover the
# deserialiser, which reads an untrusted trailer, and settling totality over
# every byte sequence in the bound is worth having. It is not worth having on
# every push: the solver runs well past an hour on a single symbolic byte, so a
# per-PR job at any timeout anyone would wait for reports a cancellation rather
# than a result. That reads as a failing gate and teaches everyone to ignore the
# gate. Nightly runs it with four hours and nobody waiting on it.
jobs:
  # `parallel` is a compile-time cfg, so the two provers can never run in one
  # process and no single test can compare them. Each build prints a digest of a
  # proof over the same fixed witness; the two lines have to match.
  #
  # A divergence means a parallel map that is not order preserving, or a search
  # returning a different witness than the serial one. Either emits a proof that
  # still verifies against itself, so nothing else catches it.
  bytes:
    name: serial and parallel emit the same proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: serial
        run: |
          cargo test --release -p stark_proofs emit_proof_digest -- --ignored --nocapture \
            | grep PROOFDIGEST | tee /tmp/serial.txt

      - name: parallel
        run: |
          cargo test --release -p stark_proofs --features parallel emit_proof_digest \
            -- --ignored --nocapture | grep PROOFDIGEST | tee /tmp/parallel.txt

      - name: compare
        run: |
          cat /tmp/serial.txt /tmp/parallel.txt
          diff /tmp/serial.txt /tmp/parallel.txt || {
            echo "the two prover forms emit different proofs"
            exit 1
          }

  axioms:
    name: no axioms beyond the core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Same reason as lean.yml: the toolchain host going down should not turn
      # this red while every proof in the repo is fine.
      - name: cache the toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}

      # elan pulls from releases.lean-lang.org, which 404s for the pinned
      # version: the project ages old releases off that host. GitHub still
      # serves them, so fetch it there and drop it where elan looks. The
      # directory name is elan's encoding of leanprover/lean4:v4.15.0.
      - name: install the pinned toolchain
        run: |
          set -euo pipefail
          pin=$(tr -d '[:space:]' < lean/lean-toolchain)          # leanprover/lean4:v4.15.0
          ver=${pin##*:}                                          # v4.15.0
          dir="$HOME/.elan/toolchains/$(echo "$pin" | sed 's|/|--|; s|:|---|')"
          if [ ! -x "$dir/bin/lake" ]; then
            curl -sSfL --retry 5 --retry-all-errors --connect-timeout 20 \
              "https://github.com/leanprover/lean4/releases/download/$ver/lean-${ver#v}-linux.tar.zst" \
              -o lean.tar.zst
            mkdir -p "$dir"
            tar --use-compress-program=unzstd -xf lean.tar.zst -C "$dir" --strip-components=1
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/lake" --version

      - name: lake build
        working-directory: lean
        run: lake build

      # `no sorry` is not the whole claim. A theorem can typecheck and still rest
      # on an axiom, so every public theorem states which it uses and the ones
      # that claim to be constructive are held to it.
      - name: print axioms
        working-directory: lean
        run: |
          {
            echo "import Zkolang"
            grep -rhoE '^theorem [A-Za-z0-9_.]+' Zkolang \
              | sed 's/^theorem //' \
              | while read -r t; do
                  ns=$(grep -rl "theorem $t" Zkolang | head -1 \
                       | sed 's|^Zkolang/|Zkolang.|; s|\.lean$||')
                  echo "#print axioms $ns.$t"
                done
          } > /tmp/axioms.lean
          lake env lean /tmp/axioms.lean | tee /tmp/axioms.out
          if grep -q 'sorryAx' /tmp/axioms.out; then
            echo "a theorem rests on sorryAx"
            exit 1
          fi
