name: proofs

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Every job reads the repository and writes nothing back.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A superseded run keeps burning minutes unless something cancels it; that is
# how a dead run once ate most of a budget. But only a run of the same kind
# supersedes: keyed on ref alone, the drifted nightly landed in the dispatch
# group and cancelled the release gate mid-run.
concurrency:
  group: proofs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# The prover's own proving, recursion and emission jobs run in the STARKs
# repository, which owns nonos-stark and the shield circuits built on it.
jobs:
  gates:
    name: every cheap gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A named release, so a new stable's lints land in a change that moves this pin.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: the ignored set
        run: |
          cargo test --workspace --release -- --include-ignored --test-threads=1
