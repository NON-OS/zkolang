name: proofs

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# A superseded run keeps burning minutes unless something cancels it; that is
# how a dead run once ate most of a budget. But only a run of the same kind
# supersedes: keyed on ref alone, the drifted nightly landed in the dispatch
# group and cancelled the release gate mid-run.
concurrency:
  group: proofs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# The prover's own proving, recursion and emission jobs run in the STARKs
# repository, which owns nonos-stark and the shield circuits built on it.
jobs:
  gates:
    name: every cheap gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: the ignored set
        run: |
          cargo test --workspace --release -- --include-ignored --test-threads=1
