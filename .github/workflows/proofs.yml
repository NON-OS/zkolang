name: proofs

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      emit:
        description: 'Also emit a recursion proof (slow, needs the big runner)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# The gates outgrew ubuntu-latest once, which is why the old nightly failed on
# every run. After the region sizing work an assembly holds in a few GB, so they
# fit a standard runner again. Only the emit still needs a large one.
jobs:
  gates:
    name: every gate, serialized
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # One at a time. The assemblies do not share a runner.
      - name: every gate
        run: cargo test --workspace --release -- --include-ignored --test-threads=1

  # The only job that still needs the large runner. Everything above fits a
  # standard one now.
  emit:
    name: emit a recursion proof
    if: github.event_name == 'workflow_dispatch' && inputs.emit
    runs-on: ubuntu-32core
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # One proof, the honest one. The file also holds three tamper rejects and
      # each of those proves too, so running the whole file is four proofs for a
      # question that one answers. The rejects run in the gates job.
      #
      # Peak is not known at full query count, so record it rather than size the
      # runner off an estimate.
      - name: emit and record the peak
        run: |
          /usr/bin/time -v cargo test --release -p stark_proofs --features parallel \
            the_assembly_accepts_the_real_inner_proof -- --ignored --nocapture 2>&1 | tee emit.log
          echo "----"
          grep -E "Maximum resident|Elapsed \(wall|assembly:" emit.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emit-log
          path: emit.log
