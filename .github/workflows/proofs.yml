name: proofs

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      emit:
        description: 'Also emit the recursion proof (the long one)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# A superseded run keeps burning minutes unless something cancels it; that is
# how a dead run once ate most of a budget. But only a run of the same kind
# supersedes: keyed on ref alone, the drifted nightly landed in the dispatch
# group and cancelled the release gate mid-run.
concurrency:
  group: proofs-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

# Every job fits a standard runner since the prover stopped materializing the
# evaluation domain: what was 55 GB of resident columns is coefficients and a
# coset buffer. Nothing here needs a paid machine or a spending limit.
jobs:
  gates:
    name: every cheap gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: the ignored set, minus the proving ones
        run: |
          cargo test --workspace --release -- --include-ignored --test-threads=1 \
            --skip recursion_assembly_tests \
            --skip step_assembly \
            --skip production_vector_gen \
            --skip probe_recursion

  proving:
    name: recursion bindings, accept and reject
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: the release gate
        run: |
          /usr/bin/time -v cargo test --release -p stark_proofs --features parallel \
            recursion_assembly_tests -- --ignored --test-threads=1 2>&1 | tee proving.log

      - name: numbers on the run page
        if: always()
        run: |
          {
            echo "## Recursion release gate"
            echo '```'
            grep -E "test result|Maximum resident|Elapsed \(wall" proving.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  transfer:
    name: emit a transfer proof
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: emit and verify it from disk
        run: |
          /usr/bin/time -v cargo run --release -p stark_proofs --features parallel \
            --bin emit_transfer -- transfer.proof 2>&1 | tee transfer.log
          sha256sum transfer.proof | tee transfer.sha256

      - name: numbers on the run page
        if: always()
        run: |
          prove=$(grep -oE 'proved in [0-9.]+s' transfer.log | head -1 | tr -dc '0-9.')
          verify=$(grep -oE 'verified from disk in [0-9.]+s' transfer.log | head -1 | tr -dc '0-9.')
          peak=$(grep 'Maximum resident' transfer.log | grep -oE '[0-9]+')
          {
            echo "## Private transfer proof"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| prove | ${prove:-?} s |"
            echo "| verify, from the written bytes | ${verify:-?} s |"
            echo "| proof size | $(wc -c < transfer.proof | tr -d ' ') bytes |"
            echo "| peak memory | $(( ${peak:-0} / 1024 )) MB |"
            echo "| sha256 | \`$(cut -d' ' -f1 transfer.sha256)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: transfer-proof
          path: |
            transfer.proof
            transfer.sha256
            transfer.log

  structure:
    name: the AIR structure and the real inner
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: structure, with the inner trace length in it
        run: |
          mkdir -p spec
          NOX_SPEC_DIR=$PWD/spec /usr/bin/time -v cargo test --release \
            -p stark_proofs --features parallel gen_production_structure \
            -- --ignored --nocapture 2>&1 | tee structure.log

      - name: the real inner proof
        run: |
          /usr/bin/time -v cargo run --release -p stark_proofs --features parallel \
            --bin emit_real_inner 2>&1 | tee inner.log

      - name: numbers on the run page
        if: always()
        run: |
          {
            echo "## Structure and inner"
            echo '```'
            grep -o '"inner_log_trace_len": [0-9]*' spec/production-air-structure.json || true
            grep -hE "inner |proved in|verified in|Maximum resident" structure.log inner.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structure-and-inner
          path: |
            spec/**
            structure.log
            inner.log

  # The contract team's oracle: the preprocessed deployment vector and the
  # per-draw intermediates, against the committed periodic root. The clean
  # rewrite of this file dropped the step that emitted these; the structure
  # alone let the verifier side catch that their evaluator predates the
  # permutation collapse, and the vector is what lets them act on it.
  vectors:
    name: the deployment vector and its intermediates
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: prove the vector against the baked root
        run: |
          mkdir -p vectors/reference
          NOX_SPEC_DIR=$PWD/vectors /usr/bin/time -v cargo test --release \
            -p stark_proofs --features parallel gen_production_recursive_vector \
            -- --ignored --nocapture 2>&1 | tee vectors.log

      - name: numbers on the run page
        if: always()
        run: |
          {
            echo "## Deployment vector"
            echo '```'
            ls -l vectors vectors/reference 2>/dev/null || true
            grep -E "Maximum resident|Elapsed \(wall|committed" vectors.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-vector
          path: |
            vectors/**
            vectors.log

  emit:
    name: emit the recursion proof
    if: github.event_name == 'workflow_dispatch' && inputs.emit
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: emit and verify it from disk
        run: |
          /usr/bin/time -v cargo run --release -p stark_proofs --features parallel \
            --bin emit_recursion -- recursion.proof 2>&1 | tee emit.log
          sha256sum recursion.proof | tee recursion.sha256

      - name: numbers on the run page
        if: always()
        run: |
          {
            echo "## Recursion proof"
            echo '```'
            grep -E "assembly |proved in|wrote|verified from disk|Maximum resident|Elapsed \(wall" emit.log || true
            cat recursion.sha256 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recursion-proof
          path: |
            recursion.proof
            recursion.sha256
            emit.log

  # The deserialiser reads an untrusted trailer, and a model checker settles
  # totality over every byte sequence in the bound rather than the ones a
  # fuzzer reached. The solver runs past an hour on one symbolic byte, so this
  # lives on the schedule with hours of budget and nobody waiting, never on a
  # push. It last existed in a workflow this repo deleted; a gate that runs
  # nowhere but is still pointed at in comments is worse than no gate.
  kani:
    name: model checked
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: model-checking/kani-github-action@v1.1
        with:
          args: -p stark_proofs --output-format terse

  # Measured numbers and real artifacts, committed back to the tree so the
  # repo always carries what its own pipeline last produced. Scheduled and
  # dispatched runs only, never PRs, and the commit skips CI so it cannot
  # recurse.
  bench:
    name: refresh bench and proofs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: transfer
        run: |
          /usr/bin/time -v cargo run --release -p stark_proofs --features parallel \
            --bin emit_transfer -- proofs/transfer.proof 2>&1 | tee transfer.log
          sha256sum proofs/transfer.proof > proofs/transfer.proof.sha256

      - name: recursion, real inner
        run: |
          /usr/bin/time -v cargo run --release -p stark_proofs --features parallel \
            --bin emit_recursion -- proofs/recursion.proof real 2>&1 | tee recursion.log
          sha256sum proofs/recursion.proof > proofs/recursion.proof.sha256

      - name: write the numbers
        run: |
          sha=$(git rev-parse --short HEAD)
          for f in transfer recursion; do
            prove=$(grep -oE 'proved in [0-9.]+' $f.log | head -1 | grep -oE '[0-9.]+')
            verify=$(grep -oE 'verified from disk in [0-9.]+[a-z]*s' $f.log | head -1)
            peak=$(grep 'Maximum resident' $f.log | grep -oE '[0-9]+')
            size=$(wc -c < proofs/$f.proof | tr -d ' ')
            printf '{\n  "commit": "%s",\n  "prove_s": %s,\n  "verify": "%s",\n  "proof_bytes": %s,\n  "peak_kb": %s\n}\n' \
              "$sha" "${prove:-null}" "${verify:-?}" "$size" "${peak:-null}" > bench/$f.json
          done
          grep -E '^assembly ' recursion.log | head -1 \
            | sed 's/assembly *//' > bench/assembly.txt || true

      - name: commit back
        run: |
          git config user.name "nonos-bench"
          git config user.email "bench@nonos.systems"
          git add bench proofs
          git diff --cached --quiet && exit 0
          git commit -m "bench: numbers for $(git rev-parse --short HEAD) [skip ci]"
          git push
