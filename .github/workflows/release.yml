name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Builds read the repository; only the job that publishes the release writes, and only
# to it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The zkolang command for each platform, packed with the licence and the README, and
  # a SHA-256 of each archive. A run started by hand builds and keeps the archives as
  # artifacts; a pushed tag also publishes them.
  build:
    name: zkolang for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          targets: ${{ matrix.target }}

      - name: build
        run: cargo build --release -p nonos_zkolang_cli --target ${{ matrix.target }}

      - name: pack
        shell: bash
        run: |
          set -euo pipefail
          name="zkolang-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/zkolang" LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zkolang-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256

  # The browser verifier: the WebAssembly module and its JavaScript interface, packed the
  # same way.
  wasm:
    name: the browser verifier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown

      - name: build
        run: cargo build --release -p nonos_zkolang_wasm --target wasm32-unknown-unknown

      - name: pack
        shell: bash
        run: |
          set -euo pipefail
          name="zkolang-${GITHUB_REF_NAME}-wasm"
          mkdir -p "dist/$name"
          cp target/wasm32-unknown-unknown/release/nonos_zkolang_wasm.wasm \
            nonos_zkolang_wasm/js/zkolang-verify.mjs LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zkolang-wasm
          path: |
            dist/*.tar.gz
            dist/*.sha256

  # The release for the tag, its notes the changelog's section for the version.
  publish:
    name: publish the release
    needs: [build, wasm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: the notes for this version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="## $version" '$0 ~ "^## " { on = index($0, v) == 1; next } on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $version"; exit 1; }

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "zKølang $GITHUB_REF_NAME" --notes-file notes.md
