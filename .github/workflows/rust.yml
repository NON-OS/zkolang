name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Every job reads the repository and writes nothing back.
permissions:
  contents: read

# New push, old run dies: a superseded run burning minutes helps nobody.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, lint, and prove
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A named release, so a new stable's lints land in a change that moves this pin.
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Formatting is enforced on the language crates.
      - name: format
        run: cargo fmt --check -p nonos_zkolang -p nonos_zkolang_cli -p nonos_zkolang_proofs -p nonos_zkolang_format7

      # Deny warnings on the language crates. --no-deps keeps the lint off
      # nonos-stark, which the STARKs repository builds and gates.
      - name: clippy
        run: cargo clippy --no-deps -p nonos_zkolang -p nonos_zkolang_cli -p nonos_zkolang_proofs -p nonos_zkolang_format7 --all-targets -- -D warnings

      # The format 7 prover across cores, the build `--features parallel` asks for.
      - name: clippy, parallel prover
        run: cargo clippy --no-deps -p nonos_zkolang_cli -p nonos_zkolang_format7 --all-targets --features nonos_zkolang_cli/parallel,nonos_zkolang_format7/parallel -- -D warnings

      # The API reference builds with no broken link or other rustdoc warning.
      - name: docs
        run: cargo doc --no-deps -p nonos_zkolang -p nonos_zkolang_cli -p nonos_zkolang_proofs -p nonos_zkolang_format7
        env:
          RUSTDOCFLAGS: -D warnings

      # The proofs crate compiles every example and stdlib circuit, runs it, and
      # for the ones with a known answer checks the output. This is where the
      # note commitment is held byte for byte against nonos-stark, which comes
      # from the STARKs repository at the revision the manifests pin.
      - name: test
        run: cargo test --workspace --release
