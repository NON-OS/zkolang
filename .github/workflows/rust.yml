name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, lint, and prove
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting is enforced on the language crates. nonos-stark carries an
      # older unformatted backlog and is left out until it is swept.
      - name: format
        run: cargo fmt --check -p nonos_zkolang -p nonos_zkolang_cli -p nonos_zkolang_proofs

      # Deny warnings on the language crates. --no-deps keeps the lint off the
      # nonos-stark path dependency, which carries its own backlog and is checked,
      # not gated, so it does not block the language.
      - name: clippy
        run: cargo clippy --no-deps -p nonos_zkolang -p nonos_zkolang_cli -p nonos_zkolang_proofs --all-targets -- -D warnings

      # The proofs crate compiles every example and stdlib circuit, runs it, and
      # for the ones with a known answer checks the output. This is where the
      # note commitment is held byte for byte against nonos-stark.
      - name: test
        run: cargo test --workspace --release -- --skip step_assembly

      # A step assembly builds a multi-gigabyte trace, and cargo runs tests across
      # every core, so two of these land on the runner at once and it is killed.
      # One at a time.
      - name: the step assembly
        run: cargo test --workspace --release step_assembly -- --test-threads=1
