name: rust

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# New push, old run dies: a superseded run burning minutes helps nobody.
concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: format, lint, and prove
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Formatting is enforced on the language crates.
      - name: format
        run: cargo fmt --check -p nonos_zkolang -p nonos_zkolang_cli -p nonos_zkolang_proofs

      # Deny warnings on the language crates. --no-deps keeps the lint off
      # nonos-stark, which the STARKs repository builds and gates.
      - name: clippy
        run: cargo clippy --no-deps -p nonos_zkolang -p nonos_zkolang_cli -p nonos_zkolang_proofs --all-targets -- -D warnings

      # The proofs crate compiles every example and stdlib circuit, runs it, and
      # for the ones with a known answer checks the output. This is where the
      # note commitment is held byte for byte against nonos-stark, which comes
      # from the STARKs repository at the revision the manifests pin.
      - name: test
        run: cargo test --workspace --release
