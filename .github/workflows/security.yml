name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so a newly published advisory is caught even with no code change.
    - cron: '17 6 * * 1'

# Every job reads the repository and writes nothing back.
permissions:
  contents: read

# New push, old run dies: a superseded run burning minutes helps nobody.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supply-chain:
    name: advisories, bans, licenses, sources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-deny reads deny.toml: known advisories, banned crates, the license
      # allowlist, and the set of trusted sources.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check all

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Scan the full history for committed keys or tokens. Pinned to a release so
      # the check is reproducible.
      - name: gitleaks
        run: |
          v=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${v}/gitleaks_${v}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --no-banner --redact --exit-code 1
