# NONOS Operating System
# Copyright (C) 2026 NONOS Contributors
#
# Host-runnable proofs for the STARK field arithmetic. Includes the real
# src/crypto/stark source and checks it against the field axioms.
[package]
name = "stark_proofs"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
path = "src/lib.rs"

[dependencies]
nonos-stark = { path = "../nonos-stark" }

[dev-dependencies]
nonos_zkolang = { path = "../nonos_zkolang" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[features]
parallel = ["nonos-stark/parallel"]
