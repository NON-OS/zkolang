# zKolang, a verifiable-compute language whose execution trace is proven by the
# NONOS transparent STARK. The workspace holds the language and its prover
# binding, the command line, and the host proof suite that keeps the two honest.
# The STARK primitives, nonos-stark, come from the STARKs repository at the
# revision the member manifests pin.

[workspace]
resolver = "2"
members = [
    "nonos_zkolang",
    "nonos_zkolang_cli",
    "nonos_zkolang_proofs",
]
